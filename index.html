ticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:20px 7vw;background:rgba(244,239,231,0.82);backdrop-filter:blur(12px);border-bottom:1px solid rgba(42,37,31,0.07)\">\n    <a href=\"#top\" style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:18px;letter-spacing:-0.01em;color:#2A251F;text-decoration:none\">Sasha Zabersky<\u002Fa>\n    <div class=\"nav-links\" style=\"display:flex;align-items:center;gap:34px\">\n      <a href=\"#work\" style=\"font-size:15px;color:#6E655B;text-decoration:none;font-weight:500\">Work<\u002Fa>\n      <a href=\"#experience\" style=\"font-size:15px;color:#6E655B;text-decoration:none;font-weight:500\">Experience<\u002Fa>\n      <a href=\"#skills\" style=\"font-size:15px;color:#6E655B;text-decoration:none;font-weight:500\">Skills<\u002Fa>\n      <a href=\"CV.dc.html\" style=\"font-size:15px;color:#6E655B;text-decoration:none;font-weight:500\">CV<\u002Fa>\n      <a href=\"mailto:sasha@zverix.com\" style=\"font-size:15px;color:#FBF8F2;text-decoration:none;font-weight:500;background:#BC5B3A;padding:9px 18px;border-radius:100px\">Get in touch<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main id=\"top\" style=\"max-width:1180px;margin:0 auto;padding:0 7vw\">\n\n    <!-- HERO -->\n    <header class=\"hero\" style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:64px;align-items:center;padding:clamp(56px,9vw,118px) 0 clamp(56px,8vw,96px)\">\n      <div>\n        <div style=\"display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#9C8C6F;margin-bottom:26px\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:#5C9A6E;display:inline-block\"><\u002Fspan>\n          Open to senior roles\n        <\u002Fdiv>\n        <h1 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(40px,5.6vw,72px);line-height:1.02;letter-spacing:-0.025em;color:#2A251F;margin-bottom:26px\">Designing calm, human products people actually understand.<\u002Fh1>\n        <p style=\"font-size:clamp(17px,1.6vw,20px);line-height:1.6;color:#6E655B;max-width:31em;margin-bottom:34px\">I'm Sasha — a UX/UI designer, creative lead, and product person. For close to {{ years }} years in the startup world I've optimized, researched, and built new products across SaaS, BI, AI/LLM, MedTech, and AdTech. I work end-to-end: research, systems, interaction, and the pixels.<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:16px\">\n          <a href=\"#work\" style=\"font-size:16px;font-weight:600;color:#FBF8F2;text-decoration:none;background:#2A251F;padding:14px 26px;border-radius:100px\">See selected work<\u002Fa>\n          <a href=\"#experience\" style=\"font-size:16px;font-weight:600;color:#2A251F;text-decoration:none;padding:14px 8px;border-bottom:2px solid #E7C9B8\">My background<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"hero-portrait\" style=\"position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:#EAE2D4;border:1px solid rgba(42,37,31,0.08)\">\n          <img src=\"12b1df50-1239-4275-b0cb-c36da9ab45d1\" alt=\"Sasha Zabersky\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- STAT STRIP -->\n    <section class=\"stat-strip\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:0 0 clamp(64px,8vw,104px);border-top:1px solid rgba(42,37,31,0.08);padding-top:46px\">\n      <sc-for list=\"{{ stats }}\" as=\"stat\" hint-placeholder-count=\"3\">\n        <div>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(30px,3.4vw,44px);letter-spacing:-0.02em;color:#BC5B3A\">{{ stat.value }}<\u002Fdiv>\n          <div style=\"font-size:15px;color:#6E655B;line-height:1.45;margin-top:6px\">{{ stat.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <!-- SELECTED WORK -->\n    <section id=\"work\" style=\"padding:0 0 clamp(64px,8vw,108px);scroll-margin-top:90px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:46px;flex-wrap:wrap;gap:12px\">\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(28px,3.4vw,42px);letter-spacing:-0.02em;color:#2A251F\">Selected work<\u002Fh2>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#9C8C6F\">{{ projectCount }} case studies<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"work-grid\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:30px\">\n        <sc-for list=\"{{ projects }}\" as=\"project\" hint-placeholder-count=\"4\">\n          <div role=\"button\" sc-camel-on-click=\"{{ project.onClick }}\" style=\"display:block;text-decoration:none;color:inherit;background:#FCFAF5;border:1px solid rgba(42,37,31,0.07);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-5px);box-shadow:0 22px 44px -26px rgba(42,37,31,0.32)\">\n            <div style=\"position:relative;aspect-ratio:16/10;background:{{ project.bg }};display:flex;align-items:flex-end;padding:16px;overflow:hidden\">\n              <sc-if value=\"{{ project.cover }}\" hint-placeholder-val=\"{{ true }}\">\n                <img src=\"{{ project.cover }}\" alt=\"{{ project.title }}\" loading=\"lazy\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left top\">\n              <\u002Fsc-if>\n              <sc-if value=\"{{ project.coverSlot }}\" hint-placeholder-val=\"{{ false }}\">\n                <div sc-camel-on-click=\"{{ stopProp }}\" style=\"position:absolute;inset:0\">\n                  <x-import component-from-global-scope=\"image-slot\" from=\"4e4e48e3-b80d-4a54-928e-ebb23b9366c6#/image-slot.js\" id=\"{{ project.slotId }}\" shape=\"rect\" placeholder=\"Drop a Lumana screenshot here\" style=\"position:absolute;inset:0;width:100%;height:100%\" hint-size=\"100%,100%\"><\u002Fx-import>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ project.noCover }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"position:relative;font-family:'JetBrains Mono',monospace;font-size:11px;color:#7d7261;background:rgba(252,250,245,0.78);padding:5px 9px;border-radius:6px\">{{ project.img }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"padding:26px 28px 30px\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:#BC5B3A\">{{ project.role }}<\u002Fspan>\n                <span style=\"font-size:11px;color:#B8AC9B\">·<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9C8C6F\">{{ project.year }}<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:23px;letter-spacing:-0.015em;color:#2A251F;margin-bottom:10px;line-height:1.18\">{{ project.title }}<\u002Fh3>\n              <p style=\"font-size:15.5px;line-height:1.6;color:#6E655B\">{{ project.blurb }}<\u002Fp>\n              <sc-if value=\"{{ project.cta }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.04em;color:#BC5B3A;font-weight:500\">{{ project.cta }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- EXPERIENCE -->\n    <section id=\"experience\" style=\"padding:clamp(56px,7vw,90px) 0;border-top:1px solid rgba(42,37,31,0.08);scroll-margin-top:80px\">\n      <div class=\"exp-grid\" style=\"display:grid;grid-template-columns:0.8fr 1.4fr;gap:56px\">\n        <div>\n          <h2 class=\"exp-title\" style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(28px,3.4vw,42px);letter-spacing:-0.02em;color:#2A251F;position:sticky;top:96px\">Experience<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <sc-for list=\"{{ experience }}\" as=\"job\" hint-placeholder-count=\"3\">\n            <div class=\"exp-row\" style=\"display:grid;grid-template-columns:1fr auto;gap:18px;padding:26px 0;border-top:1px solid rgba(42,37,31,0.1)\">\n              <div>\n                <h3 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:20px;color:#2A251F;letter-spacing:-0.01em\">{{ job.title }}<\u002Fh3>\n                <div style=\"font-size:15.5px;color:#BC5B3A;font-weight:500;margin:4px 0 10px\">{{ job.company }}<\u002Fdiv>\n                <p style=\"font-size:15px;line-height:1.58;color:#6E655B;max-width:36em\">{{ job.note }}<\u002Fp>\n                <sc-if value=\"{{ job.bullets }}\" hint-placeholder-val=\"{{ true }}\">\n                  <ul style=\"margin:15px 0 2px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;max-width:38em\">\n                    <sc-for list=\"{{ job.bullets }}\" as=\"point\" hint-placeholder-count=\"3\">\n                      <li style=\"position:relative;padding-left:20px;font-size:14.5px;line-height:1.55;color:#5C544B\">\n                        <span style=\"position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:#BC5B3A\"><\u002Fspan>\n                        {{ point }}\n                      <\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Ful>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div class=\"exp-period\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#9C8C6F;white-space:nowrap;text-align:right;padding-top:4px\">{{ job.period }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- SKILLS -->\n    <section id=\"skills\" style=\"padding:clamp(56px,7vw,90px) 0;border-top:1px solid rgba(42,37,31,0.08);scroll-margin-top:80px\">\n      <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(28px,3.4vw,42px);letter-spacing:-0.02em;color:#2A251F;margin-bottom:46px\">What I bring<\u002Fh2>\n      <div class=\"skills-grid\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:30px\">\n        <sc-for list=\"{{ skillGroups }}\" as=\"group\" hint-placeholder-count=\"3\">\n          <div style=\"background:#FCFAF5;border:1px solid rgba(42,37,31,0.07);border-radius:18px;padding:28px 26px\">\n            <h3 style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#9C8C6F;margin-bottom:18px\">{{ group.label }}<\u002Fh3>\n            <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n              <sc-for list=\"{{ group.items }}\" as=\"skill\" hint-placeholder-count=\"5\">\n                <span style=\"font-size:14.5px;color:#3F3A33;background:#F1EADF;border:1px solid rgba(42,37,31,0.06);padding:7px 13px;border-radius:100px\">{{ skill }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- CONTACT -->\n    <section id=\"contact\" style=\"padding:clamp(64px,9vw,120px) 0 clamp(72px,9vw,128px)\">\n      <div style=\"background:#2A251F;border-radius:28px;padding:clamp(40px,6vw,76px);position:relative;overflow:hidden\">\n        <div style=\"position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gra order-radius:100px\">2025 — Present<\u002Fspan>\n              <span style=\"font-size:14px;color:#3F3A33;background:#F1EADF;border:1px solid rgba(42,37,31,0.06);padding:7px 14px;border-radius:100px\">Concept → design system → handoff<\u002Fspan>\n              <span style=\"font-size:14px;color:#3F3A33;background:#F1EADF;border:1px solid rgba(42,37,31,0.06);padding:7px 14px;border-radius:100px\">Figma → Claude Code<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <sc-for list=\"{{ detailFlows }}\" as=\"flow\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;padding-top:30px;border-top:1px solid rgba(42,37,31,0.16)\">\n                    <div style=\"display:flex;align-items:baseline;gap:14px\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#BC5B3A;font-weight:500\">{{ flow.num }}<\u002Fspan>\n                      <h3 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(20px,2.2vw,26px);letter-spacing:-0.015em;color:#2A251F\">{{ flow.name }}<\u002Fh3>\n                    <\u002Fdiv>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:#BC5B3A;padding-top:4px\">{{ flow.tag }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"font-size:16px;line-height:1.6;color:#6E655B;max-width:60em;margin-bottom:22px\">{{ flow.desc }}<\u002Fp>\n                  <div style=\"display:flex;flex-direction:column;gap:26px\">\n                    <sc-for list=\"{{ flow.views }}\" as=\"view\" hint-placeholder-count=\"1\">\n                      <div>\n                        <sc-if value=\"{{ view.label }}\" hint-placeholder-val=\"{{ true }}\">\n                          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:11px\">\n                            <span style=\"width:6px;height:6px;border-radius:50%;background:#BC5B3A\"><\u002Fspan>\n                            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:#5C544B;font-weight:500\">{{ view.label }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <figure style=\"margin:0;background:#FCFAF5;border:1px solid rgba(42,37,31,0.09);border-radius:18px;overflow:hidden;box-shadow:0 22px 50px -30px rgba(42,37,31,0.4)\">\n                          <div style=\"display:flex;align-items:center;gap:12px;padding:13px 16px;background:#F1EADF;border-bottom:1px solid rgba(42,37,31,0.08)\">\n                            <div style=\"display:flex;gap:7px;flex-shrink:0\">\n                              <span style=\"width:11px;height:11px;border-radius:50%;background:#E0A89A\"><\u002Fspan>\n                              <span style=\"width:11px;height:11px;border-radius:50%;background:#E6CDA0\"><\u002Fspan>\n                              <span style=\"width:11px;height:11px;border-radius:50%;background:#B7C9A8\"><\u002Fspan>\n                            <\u002Fdiv>\n                            <div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:#FCFAF5;border:1px solid rgba(42,37,31,0.08);border-radius:8px;padding:6px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#9C8C6F;max-width:380px;margin:0 auto\">{{ view.pill }}<\u002Fdiv>\n                            <a href=\"{{ view.url }}\" target=\"_blank\" rel=\"noopener\" style=\"flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12px;color:#BC5B3A;text-decoration:none;font-weight:500\">Open ↗<\u002Fa>\n                          <\u002Fdiv>\n                          <div class=\"embed-box\" style=\"position:relative;width:100%;height:620px;overflow:hidden;background:#fff\">\n                            <iframe src=\"{{ view.url }}\" loading=\"lazy\" title=\"{{ flow.name }}\" class=\"embed-frame\" style=\"position:absolute;top:0;left:0;transform-origin:top left;border:0;background:#fff\"><\u002Fiframe>\n                          <\u002Fdiv>\n                        <\u002Ffigure>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { openIdx: null, openSub: null };\n  componentDidMount() {\n    this._onKey = (e) => { if (e.key === \"Escape\") { if (this.state.openSub != null) this.setState({ openSub: null }); else this.setState({ openIdx: null }); } };\n    window.addEventListener(\"keydown\", this._onKey);\n    this._onResize = () => this.scaleEmbeds();\n    window.addEventListener(\"resize\", this._onResize);\n    this.scaleEmbeds();\n  }\n  componentDidUpdate() { this.scaleEmbeds(); }\n  scaleEmbeds() {\n    const NATIVE = 1360;\n    requestAnimationFrame(() => {\n      document.querySelectorAll(\".embed-box\").forEach((box) => {\n        const frame = box.querySelector(\".embed-frame\");\n        if (!frame) return;\n        const w = box.clientWidth, h = box.clientHeight;\n        if (!w || !h) return;\n        const k = w / NATIVE;\n        frame.style.width = NATIVE + \"px\";\n        frame.style.height = (h / k) + \"px\";\n        frame.style.transform = \"scale(\" + k + \")\";\n      });\n    });\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"keydown\", this._onKey);\n    window.removeEventListener(\"resize\", this._onResize);\n  }\n  renderVals() {\n    const projects = [\n      { title: \"Lumana — AI video-security platform\", role: \"SaaS · AI · Security\", year: \"2025–\", blurb: \"End-to-end UX for a data-rich monitoring platform — three new products from concept to launch, plus the design system and Figma→Claude Code handoff tying the suite together.\", img: \"lumana-cover.jpg\", bg: \"repeating-linear-gradient(45deg,#E7DCC9,#E7DCC9 11px,#DFD2BD 11px,#DFD2BD 22px)\" },\n      { title: \"Alison.ai — AI video platform\", role: \"AI · AdTech\", year: \"2022–24\", blurb: \"Led the rebrand and full UX overhaul of the AI video platform — new dashboard, navigation and features — plus the LLM-based Smart Brief briefing tool.\", img: \"alison-cover.jpg\", bg: \"repeating-linear-gradient(45deg,#E8DCCB,#E8DCCB 11px,#E1D4C0 11px,#E1D4C0 22px)\" },\n      { title: \"2BPrecise — precision-medicine platform\", role: \"MedTech\", year: \"—\", blurb: \"Clinical precision-medicine tooling that makes complex genomic data legible at the point of care — spanning the medical-insight app and germline lab-results aggregation.\", img: \"2bprecise-app-cover.jpg\", bg: \"repeating-linear-gradient(45deg,#EADBCF,#EADBCF 11px,#E3D2C3 11px,#E3D2C3 22px)\" },\n      { title: \"Howze\", role: \"Mobile app · Personal\", year: \"MVP\", blurb: \"My own DIY app — helping amateur and semi-pro carpenters plan, calculate and assemble their builds end-to-end.\", img: \"howze-cover.jpg\", bg: \"repeating-linear-gradient(45deg,#E6DDCC,#E6DDCC 11px,#DED3C0 11px,#DED3C0 22px)\" },\n      { title: \"Local projects\", role: \"Web · Brand\", year: \"—\", blurb: \"Hebrew, right-to-left websites and branding for local ventures — including Alexitabull and Woodbuilder Academy.\", img: \"alexitabull.jpg\", bg: \"repeating-linear-gradient(45deg,#E9DECB,#E9DECB 11px,#E1D4BE 11px,#E1D4BE 22px)\" },\n    ];\n    const experience = [\n      { title: \"Senior UX Designer\", company: \"Lumana\", period: \"2025 — Present\", note: \"Owned the end-to-end UX of a complex, data-rich AI video-security platform — taking 3 new products from concept to launch, building a Figma design system, and wiring design straight into engineering via Claude Code for sharper handoff.\" },\n      { title: \"Head of Creative & Senior Product Manager\", company: \"Alison.AI\", period: \"2022 — 2024\", note: \"Led the redesign, rebranding and overall UX of the web app. Owned ideation, prioritisation and delegation, plus user testing and analytics.\" },\n      { title: \"UX, UI & Product Consultant\", company: \"Zverix\", period: \"2018 — Present\", note: \"Independent consultant for a range of startups — planning, prototyping and designing complex systems end-to-end.\" },\n      { title: \"Carpenter & Founder\", company: \"Babe the Builder\", period: \"2018 — 2022\", note: \"Founded and ran my own small carpentry business doing interior and exterior woodworking.\" },\n      { title: \"Mobile Product Manager & Creative\", company: \"Magisto (Vimeo)\", period: \"2017 — 2018\", note: \"Drove ideation, prioritisation and delegation for the mobile division, with user testing and follow-up.\" },\n      { title: \"Director of Product & Head of Creative\", company: \"MyPermissions\", period: \"2013 — 2017\", note: \"Owned product direction and creative, plus business-partner coordination.\" },\n      { title: \"UI/UX Designer\", company: \"Various startups\", period: \"2006 — 2013\", note: \"Cut my teeth across early-stage startups, designing interfaces and learning to ship.\" },\n    ];\n    const skillGroups = [\n      { label: \"Craft\", items: [\"Product strategy\", \"Interaction design\", \"Prototyping\", \"Information architecture\", \"Visual & brand design\"] },\n      { label: \"Research & product\", items: [\"User research\", \"Usability testing\", \"Ideation & prioritisation\", \"Analytics\", \"Delegation & leadership\"] },\n      { label: \"Domains\", items: [\"SaaS\", \"BI\", \"AI / LLM\", \"MedTech\", \"AdTech\", \"B2B & B2C\"] },\n    ];\n    const stats = [\n      { value: \"~20 yrs\", label: \"in the startup world, across many industries\" },\n      { value: \"Creative + Product\", label: \"design leadership and hands-on PM\" },\n      { value: \"SaaS · AI · MedTech\", label: \"deep experience across regulated & fast-moving domains\" },\n    ];\n    const CDN = \"https://static.wixstatic.com/media/\";\n    const details = {\n      0: { live: true, cover: \"assets/lumana-cover.jpg\", coverCaption: \"lumana.ai — VIA-1 video intelligence\", images: [], summary: \"As one of two designers, I own the end-to-end UX of a complex web app — concept, flows, design system, and developer handoff. A defining win was wiring design straight into engineering: UX moves from Figma into Claude Code against the real codebase, sharpening handoff accuracy and saving serious dev and design hours. The prototypes below are live — click around.\" },\n      1: { cover: \"assets/alison-cover.png\", coverCardOnly: true, sections: true, summary: \"Two chapters of work on Alison.ai's AI video-analysis platform — the system-wide rebrand and UX overhaul, and the LLM-based Smart Brief briefing tool. Both are broken out below.\", sectionList: [\n        { name: \"Rebrand, optimization & dashboard\", tag: \"Rebrand · UX overhaul\", desc: \"Complete redesign of the existing data table, plus a new dashboard, navigation and a range of new functionalities. Built in Figma with an app-wide style guide and functioning prototypes — from product and UX research through to implementation. The interactive prototype below is live — try it.\", live: \"https://zverya.github.io/alison-ai-prototype/dashboard/\", pill: \"alison.ai/dashboard\", images: [] },\n        { name: \"Smart Brief\", tag: \"AI · LLM\", desc: \"An LLM-based screenplay generator that builds on Alison.ai's recommendations for the elements that make creative work. My role spanned ideation, concept development, AI-API optimization, branding and optimization. The interactive demo below is live — try it.\", live: \"https://zverya.github.io/alison-smart-brief-demo/\", pill: \"alison.ai/smart-brief\", images: [] },\n      ] },\n      2: { subProjects: true, cover: CDN + \"b63922_7cc1c214fb3c453ca864cb2ddaca736d~mv2.png\", coverCardOnly: true, summary: \"Two bodies of work for 2BPrecise's clinical precision-medicine platform — a medical-insight app that layers genomic context onto the EMR, and a germline lab-results aggregation view. Open each below.\", subList: [\n        { name: \"Precision medicine app\", tag: \"UX/UI Lead · MedTech\", desc: \"UX/UI Lead for a medical-insight desktop/web app that layers extra information onto EMRs for healthcare providers. A redesign that cleared out clutter and unified the UI and UX across the product's modules.\", cover: CDN + \"b63922_7cc1c214fb3c453ca864cb2ddaca736d~mv2.png\", images: [\n          { src: CDN + \"b63922_7cc1c214fb3c453ca864cb2ddaca736d~mv2.png\", caption: \"Redesign & navigation between the app's modules\" },\n          { src: \"assets/emr-pgx.png\", caption: \"PGx profile embedded in the Cerner EMR\" },\n          { src: \"assets/emr-somatic-full.png\", caption: \"Somatic profile — genomic findings in EMR context\" },\n          { src: \"assets/emr-somatic-open.png\", caption: \"Somatic profile — opened over the chart\" },\n          { src: \"assets/emr-germline-hover.png\", caption: \"Germline profile — quick-view popover\" },\n          { src: \"assets/emr-somatic-hover.png\", caption: \"Somatic profile — quick-view popover\" },\n        ] },\n        { name: \"Germline lab results aggregation\", tag: \"MedTech · IA\", desc: \"Aggregating germline lab reports into a single, decision-ready clinical view — prenatal gene mapping for one of the parents, structuring dense results so clinicians can scan and act quickly.\", cover: \"assets/germline-summary.png\", images: [\n          { src: \"assets/germline-summary.png\", caption: \"Results summary\" },\n          { src: CDN + \"b63922_72b087e282814b7495a910bd3fcb9613~mv2.png\", caption: \"Aggregated results view\" },\n          { src: CDN + \"b63922_88d8378ce03343edb01f5756618ea1fd~mv2.png\", caption: \"Collapsed state\" },\n          { src: CDN + \"b63922_38637df70fc24570ba088342091d0f53~mv2.png\", caption: \"Empty / no-results state\" },\n        ] },\n        { name: \"Patient's treatment timeline\", tag: \"MedTech · Prototype\", desc: \"A timeline interface giving clinicians an at-a-glance history of a patient's treatment and care milestones — explored as an interactive Axure prototype. The live prototype is embedded below.\", cover: CDN + \"b63922_0b483f0b74e34bce9724729ad28017e0~mv2.png\", embed: \"https://2qu38z.axshare.com/?id=79q00l&sc=2\", embedPill: \"axshare.com · timeline prototype\", images: [] },\n        { name: \"Pharmacogenomics (PGx) profile\", tag: \"MedTech · UI\", desc: \"The pharmacogenomics profile — surfacing medication-gene interactions and FDA testing guidance so clinicians can weigh effectiveness, dosage and side-effect risk at a glance.\", cover: \"assets/pgx-overview.png\", images: [\n          { src: \"assets/pgx-overview.png\", caption: \"PGx profile — overview & guidance\" },\n          { src: \"assets/pgx-expanded.png\", caption: \"PGx profile — expanded medication detail\" },\n        ] },\n      ] },\n      3: { cover: CDN + \"b63922_790df680c0af4cd0a81fc22332f92a85~mv2.png\", coverCardOnly: true, mobileEmbed: \"https://howze.app/\", embedPill: \"howze.app\", summary: \"A DIY mobile app that helps the amateur or semi-professional carpenter plan, calculate and assemble a project — my own product, currently an MVP in development. The live app is embedded below.\", images: [] },\n      4: { cover: \"assets/alexitabull.jpg\", coverCardOnly: true, sections: true, summary: \"Hebrew, right-to-left (RTL) websites and branding for local ventures, built on the Wix platform — concept, branding, marcom and marketing — including Woodbuilder Academy.\", sectionList: [\n        { name: \"Alexitabull\", tag: \"RTL site · Live\", desc: \"A made-to-measure dog-wheelchair studio I was an active part of. I built the full RTL marketing site that tells the product story, walks owners through the fitting process, and handles ordering — made to feel warm and reassuring for people caring for a disabled pet.\", live: \"https://www.alexitabull.com/\", pill: \"alexitabull.com\", images: [] },\n        { name: \"Woodbuilder Academy\", tag: \"Branding · Marketing\", desc: \"The site for a wood-framing trade school I'm part of — I led concept, branding, marcom and marketing across web and mobile. Shown as a screenshot here since the live site has since been updated.\", images: [\n          { src: CDN + \"b63922_62ec7f0b82154176bc0dddd7f00f48d1~mv2.png\", caption: \"woodbuilders.academy\" },\n        ] },\n      ] },\n    };\n    projects.forEach((p, i) => {\n      p.detail = details[i] || null;\n      p.cover = p.detail ? (p.detail.cover || (p.detail.images && p.detail.images[0] && p.detail.images[0].src) || null) : null;\n      p.coverSlot = i === 0 && !p.cover;\n      p.slotId = i === 0 ? \"lumana-cover\" : null;\n      p.noCover = !p.cover && !p.coverSlot;\n      if (i === 0) { p.cta = \"View live case study →\"; p.onClick = () => this.setState({ openIdx: i, openSub: null }); }\n      else if (p.detail) { p.cta = \"View case study →\"; p.onClick = () => this.setState({ openIdx: i, openSub: null }); }\n      else { p.cta = null; p.onClick = null; }\n    });\n    const open = this.state.openIdx != null ? projects[this.state.openIdx] : null;\n    const caseStudies = [\n      {\n        name: \"Control panel\",\n        tag: \"Operator + admin\",\n        desc: \"A two-sided product: the streamlined operator panel for day-to-day monitoring and response, paired with the admin console behind it for configuration and oversight. Both views below are live, interactive Figma Make prototypes.\",\n        views: [\n          { label: \"Operator-facing\", pill: \"lumana.app/control-panel\", url: \"https://tree-cola-40118624.figma.site\" },\n          { label: \"Admin behind\", pill: \"lumana.app/control-panel/admin\", url: \"https://horn-primer-33424341.figma.site\" },\n        ],\n      },\n      {\n        name: \"Parking Enforcement System\",\n        tag: \"New product · 0→1\",\n        desc: \"One of the new products I took from PRD to interactive prototype — automated parking and bus-lane violation detection, evidence capture, and reporting workflows built for field inspectors and their supervisors.\",\n        views: [{ pill: \"lumana.app/parking-enforcement\", url: \"https://broken-clump-59708695.figma.site\" }],\n      },\n      {\n        name: \"Live view & PTZ presets\",\n        tag: \"Operator console\",\n        desc: \"The operator's real-time view — PTZ patrol controls, timeline scrubbing, on-frame zone drawing, and a streamlined flow for creating, naming and managing camera presets.\",\n        views: [{ pill: \"lumana.app/camera\", url: \"https://mocks.zverya-lumana.workers.dev/camera/index.html\" }],\n      },\n      {\n        name: \"Camera settings, restructured\",\n        tag: \"Information architecture\",\n        desc: \"A ground-up restructure of a sprawling settings page into a clear, sectioned IA — Details, Streams, Live view, Analytics, Storage, Image, Hardware and Monitoring — that stays legible across every camera type. The same structure scales to bulk-editing dozens of cameras at once: with mixed values, fields left as “---” stay untouched, so one change applies cleanly across a selection without clobbering the rest.\",\n        views: [\n          { label: \"Single camera\", pill: \"lumana.app/camera/edit\", url: \"https://mocks.zverya-lumana.workers.dev/camera/edit.html\" },\n          { label: \"Bulk edit\", pill: \"lumana.app/camera/bulk-edit\", url: \"https://mocks.zverya-lumana.workers.dev/camera/bulk-edit.html\" },\n        ],\n      },\n      {\n        name: \"Incident investigation timeline\",\n        tag: \"Investigation workflow\",\n        desc: \"An enriched timeline that pulls every event, clip and detection into one investigative view — paired with visual mapping and evidence management so security teams can reconstruct what happened and act faster.\",\n        views: [{ pill: \"lumana.app/investigation\", url: \"https://mode-east-01480120.figma.site\" }],\n      },\n    ];\n    caseStudies.forEach((c, i) => { c.num = String(i + 1).padStart(2, \"0\"); });\n    const detailSectionList = open && open.detail && open.detail.sections\n      ? open.detail.sectionList.map((s, i) => ({ ...s, num: String(i + 1).padStart(2, \"0\") }))\n      : [];\n    let detailImages = open && open.detail && open.detail.images ? open.detail.images.slice() : [];\n    const isSub = !!(open && open.detail && open.detail.subProjects);\n    const subList = isSub ? open.detail.subList.map((s, i) => ({\n      ...s, num: String(i + 1).padStart(2, \"0\"), onClick: () => this.setState({ openSub: i }),\n    })) : [];\n    const openSub = isSub && this.state.openSub != null ? subList[this.state.openSub] : null;\n    if (openSub) detailImages = openSub.images.slice();\n    if (open && open.detail && open.detail.cover && !open.detail.coverCardOnly && !detailImages.some((s) => s.src === open.detail.cover)) {\n      detailImages.unshift({ src: open.detail.cover, caption: open.detail.coverCaption || \"Overview\" });\n    }\n    return {\n      years: \"20\", projects, experience, skillGroups, stats, caseStudies,\n      projectCount: String(projects.length),\n      detailOpen: !!open,\n      detailTitle: open ? open.title : \"\",\n      detailRole: open ? open.role : \"\",\n      detailYear: open ? open.year : \"\",\n      detailSummary: open && open.detail ? open.detail.summary : \"\",\n      detailImages: detailImages,\n      detailEmbed: openSub ? (openSub.embed || \"\") : (open && open.detail ? (open.detail.embed || \"\") : \"\"),\n      detailEmbedPill: openSub ? (openSub.embedPill || \"\") : (open && open.detail ? (open.detail.embedPill || \"\") : \"\"),\n      detailMobileEmbed: open && open.detail ? (open.detail.mobileEmbed || \"\") : \"\",\n      detailStack: !!(open && open.detail && !open.detail.sections && !open.detail.subProjects && detailImages.length && !open.detail.grid) || !!(openSub && detailImages.length),\n      detailGrid: !!(open && open.detail && !open.detail.sections && detailImages.length && open.detail.grid),\n      detailLive: !!(open && open.detail && open.detail.live),\n      detailFlows: open && open.detail && open.detail.live ? caseStudies : [],\n      detailSections: !!(open && open.detail && open.detail.sections),\n      detailSectionList: detailSectionList,\n      detailSubGrid: isSub && !openSub,\n      detailSubList: subList,\n      detailSubOpen: !!openSub,\n      subName: openSub ? openSub.name : \"\",\n      subTag: openSub ? openSub.tag : \"\",\n      subDesc: openSub ? openSub.desc : \"\",\n      backToSubs: () => this.setState({ openSub: null }),\n      openLumana: () => this.setState({ openIdx: 0, openSub: null }),\n      closeDetail: () => this.setState({ openIdx: null, openSub: null }),\n      stopProp: (e) => e.stopPropagation(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
